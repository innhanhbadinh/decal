<script>
/**
 * Công thức tính giá decal — bản THUẦN JS chạy trên trình duyệt, không cần server.
 * Cổng logic y hệt src/pricing.js (bản server) — đã test đối chiếu cho ra cùng kết quả.
 * Chỉ khác: dữ liệu Excel (GIAYDECAL/BETHUONG/KETP/BEKHO/INGIAY/INDECAL) được nhúng sẵn
 * dưới dạng JSON tĩnh thay vì đọc file .xlsx qua server lúc chạy.
 */
(function (global) {
  'use strict';

  // ---- vlookup: dò bảng giá theo bậc số lượng (giống VLOOKUP(...,TRUE) trong Excel) ----
  function vlookup(rows, soLuong, opts) {
    opts = opts || {};
    if (!rows || rows.length === 0) return 0;
    var filtered = rows;
    if (opts.tenDecal && 'Loại giấy' in rows[0]) {
      filtered = filtered.filter(function (r) { return r['Loại giấy'] === opts.tenDecal; });
    }
    var eligible = filtered
      .filter(function (r) { return typeof r['Số lượng'] === 'number' && r['Số lượng'] <= soLuong; })
      .sort(function (a, b) { return a['Số lượng'] - b['Số lượng']; });
    if (eligible.length === 0) return 0;
    return eligible[eligible.length - 1]['Giá'] || 0;
  }

  var DIEN_TICH_TO = 32 * 43;

  var NHOM_GIAY_THUONG = [
    'Decal giấy Oji 32x40', 'Decal giấy Oji 32x43', 'Decal giấy Oji 32x45', 'Decal giấy Oji 33x45', 'Decal giấy Oji 33x48',
    'Decal đế nhám', 'Decal Fasson', 'Decal Kraft'
  ];

  function heSoHaoHut(shapeLabel) {
    if (shapeLabel === 'Hình tròn' || shapeLabel === 'Hình Oval') return 0.45;
    return 0.7;
  }

  function xacDinhNhomBe(shape, widthCm, heightCm) {
    var minDim = Math.min(widthCm, heightCm);
    if (minDim < 2) return 'BEKHO';
    return (shape && shape.nhomBe) || 'BETHUONG';
  }

  function uocLuongSoTemMoiTo(shapeLabel, widthCm, heightCm) {
    var dienTichHieuDung = DIEN_TICH_TO * heSoHaoHut(shapeLabel);
    return Math.max(1, Math.floor(dienTichHieuDung / (widthCm * heightCm)));
  }

  function tinhChiPhiSheetBased(sheets, material, shape, widthCm, heightCm, qty) {
    if (!sheets || !material) return 0;
    var soTemMoiTo = uocLuongSoTemMoiTo(shape && shape.label, widthCm, heightCm);
    var soToGiayCanThiet = Math.max(1, Math.ceil(qty / soTemMoiTo));

    var dungGiayThuong = NHOM_GIAY_THUONG.indexOf(material.excelLoaiGiay) !== -1;
    var sheetIn = dungGiayThuong ? sheets.INGIAY : sheets.INDECAL;
    var chiPhiIn = vlookup(sheetIn, soToGiayCanThiet * 2);

    var nhomBe = xacDinhNhomBe(shape, widthCm, heightCm);
    var chiPhiBe = vlookup(sheets[nhomBe], soToGiayCanThiet);

    var chiPhiGiay = vlookup(sheets.GIAYDECAL, 1, { tenDecal: material.excelLoaiGiay });

    var tong = (chiPhiIn * 2 + chiPhiBe + chiPhiGiay) * soToGiayCanThiet;
    return tong / qty;
  }

  function lamTronChanHangNghin(so) {
    return Math.ceil(so / 1000) * 1000;
  }

  function promoRateForQty(qty, tiers) {
    var sorted = (tiers || []).slice().sort(function (a, b) { return b.minQty - a.minQty; });
    for (var i = 0; i < sorted.length; i++) {
      if (qty >= sorted[i].minQty) return sorted[i].rate;
    }
    return 0;
  }

  /**
   * Hàm tính giá chính — tương đương estimate() trong src/pricing.js bản server.
   * @param {object} sheets   dữ liệu Excel đã nhúng (GIAYDECAL/BETHUONG/KETP/BEKHO/INGIAY/INDECAL)
   * @param {object} cfg      cấu hình giá (floor, promoTiers, promoCode)
   * @param {object} input    {material, shape, sides, laminate, rush, width, height, qty, promoCode}
   *                          material/shape/sides/laminate/rush là object lấy trực tiếp từ danh sách cfg tương ứng
   */
  function estimate(sheets, cfg, input) {
    var material = input.material;
    var shape = input.shape;
    var sides = input.sides || { mult: 1 };
    var laminate = input.laminate || { mult: 1 };
    var rush = input.rush || { mult: 1 };

    var w = Math.max(parseFloat(input.width) || 0, 1);
    var h = Math.max(parseFloat(input.height) || 0, 1);
    var q = Math.max(parseInt(input.qty, 10) || 1, 1);

    var unitFromSheets = tinhChiPhiSheetBased(sheets, material, shape, w, h, q);
    var rawUnit = unitFromSheets * (sides.mult || 1) * (laminate.mult || 1) * (rush.mult || 1);
    var unit = Math.max(rawUnit, cfg.floor || 0);
    var subtotal = unit * q;

    var promoRate = promoRateForQty(q, cfg.promoTiers);
    var promoAmount = subtotal * promoRate;
    var afterPromo = subtotal - promoAmount;

    var codeApplied = false;
    var codeAmount = 0;
    if (input.promoCode && cfg.promoCode && cfg.promoCode.code &&
        String(input.promoCode).trim().toUpperCase() === cfg.promoCode.code.toUpperCase()) {
      codeApplied = true;
      codeAmount = afterPromo * (cfg.promoCode.rate || 0);
    }

    var total = lamTronChanHangNghin(afterPromo - codeAmount);

    var subtotalRounded = lamTronChanHangNghin(subtotal);
    var displayUnit = Math.floor(subtotalRounded / q);
    var displaySubtotal = displayUnit * q;
    var displayPromo = Math.max(0, displaySubtotal - total);

    return {
      material: material ? material.title : null,
      shape: shape ? shape.label : null,
      quantity: q,
      unit: displayUnit,
      subtotal: displaySubtotal,
      promoRate: promoRate,
      promoAmount: displayPromo,
      codeApplied: codeApplied,
      codeAmount: 0,
      total: total
    };
  }

  global.DecalPricingEngine = {
    vlookup: vlookup,
    estimate: estimate,
    heSoHaoHut: heSoHaoHut,
    xacDinhNhomBe: xacDinhNhomBe,
    uocLuongSoTemMoiTo: uocLuongSoTemMoiTo
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

  body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg-soft);}

  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;}

  .btn-ghost{border-color:transparent;color:var(--ink-soft);}
  .btn-ghost:hover{color:#E4572E;border-color:#F3C9BB;background:#FDF3F0;}

  .layout{display:grid;grid-template-columns:440px 1fr;height:calc(100vh - 53px);}
  .panel{overflow-y:auto;padding:20px;border-right:1px solid var(--border);background:#fff;}
  .preview-pane{background:#EDEFF3;padding:16px;overflow:hidden;}
  .preview-pane iframe{width:100%;height:100%;border:0;border-radius:10px;background:#fff;box-shadow:0 4px 20px rgba(22,35,61,.08);}

  details.section{border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden;}
  details.section summary{padding:13px 16px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--bg-soft);list-style:none;display:flex;align-items:center;justify-content:space-between;}
  details.section summary::-webkit-details-marker{display:none;}
  details.section summary::after{content:'+';font-size:16px;color:var(--ink-soft);}
  details.section[open] summary::after{content:'−';}
  details.section .content{padding:16px;}

  .f-row{margin-bottom:14px;}
  .f-row label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .f-row input[type="text"],.f-row input[type="url"],.f-row textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-family:inherit;font-size:13px;color:var(--ink);}
  .f-row textarea{resize:vertical;min-height:52px;}
  .f-row input:focus,.f-row textarea:focus{outline:none;border-color:var(--primary);}
  .f-row .hint{font-size:11px;color:#8B96A8;margin-top:4px;}
  .img-preview{width:100%;height:90px;object-fit:cover;border-radius:7px;margin-top:8px;border:1px solid var(--border);background:var(--bg-soft);}
  .upload-row{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;}
  .upload-row input[type="file"]{flex:1;font-size:11.5px;padding:6px;border:1px dashed var(--border);border-radius:7px;background:#fff;min-width:160px;}
  .upload-status{font-size:11px;color:var(--ink-soft);}
  .upload-status.ok{color:#1D9A5B;}
  .upload-status.err{color:#E4572E;}

  .item-card{border:1px solid var(--border);border-radius:9px;padding:14px;margin-bottom:12px;position:relative;background:var(--bg-soft);}
  .item-card .item-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .item-card .item-top span{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
  .item-remove{font-size:11px;color:#E4572E;background:none;border:0;font-weight:600;}
  .item-remove:hover{text-decoration:underline;}
  .add-item-btn{width:100%;padding:10px;border:1.5px dashed var(--border);border-radius:9px;background:#fff;color:var(--primary);font-size:13px;font-weight:600;}
  .add-item-btn:hover{border-color:var(--primary);background:var(--primary-light);}
  .color-row{display:flex;align-items:center;gap:10px;}
  .color-row input[type="color"]{width:40px;height:34px;border:1px solid var(--border);border-radius:6px;padding:2px;}
  .price-row{display:flex;align-items:center;gap:8px;}

    .panel{border-right:0;border-bottom:1px solid var(--border);}

  /* ---------------- Content persistence (LOCAL — không cần server, dùng localStorage hoặc
     window.storage nếu đang mở trong Claude) ---------------- */
  var LOCAL_KEY = 'decal-static-admin-content-v1';

  function trySet(key, value){
    try {
      if (typeof window.storage !== 'undefined' && window.storage) {
        window.storage.set(key, value).catch(function(){});
      }
    } catch (e) {}
    try { localStorage.setItem(key, value); } catch (e) { /* artifact có thể chặn — bỏ qua, không crash */ }
  }

  function tryGet(key){
    try { var v = localStorage.getItem(key); if (v) return Promise.resolve(v); } catch (e) {}
    try {
      if (typeof window.storage !== 'undefined' && window.storage) {
        return window.storage.get(key).then(function(r){ return r && r.value; }).catch(function(){ return null; });
      }
    } catch (e) {}
    return Promise.resolve(null);
  }

  function saveLocal(){
    var status = document.getElementById('saveStatus');
    trySet(LOCAL_KEY, JSON.stringify(content));

  }

  function loadLocal(){
    tryGet(LOCAL_KEY).then(function(v){
      if (v) { try { content = Object.assign(defaultContent(), JSON.parse(v)); } catch (e) { content = defaultContent(); } }
      return tryGet('decal-static-excel-data-v1');
    }).then(function(ev){

sh l\u00e0 object l\u1ea5y tr\u1ef1c ti\u1ebfp t\u1eeb danh s\u00e1ch cfg t\u01b0\u01a1ng \u1ee9ng\n   */\n  function estimate(sheets, cfg, input) {\n    var material = input.material;\n    var shape = input.shape;\n    var sides = input.sides || { mult: 1 };\n    var laminate = input.laminate || { mult: 1 };\n    var rush = input.rush || { mult: 1 };\n\n    var w = Math.max(parseFloat(input.width) || 0, 1);\n    var h = Math.max(parseFloat(input.height) || 0, 1);\n    var q = Math.max(parseInt(input.qty, 10) || 1, 1);\n\n    var unitFromSheets = tinhChiPhiSheetBased(sheets, material, shape, w, h, q);\n    var rawUnit = unitFromSheets * (sides.mult || 1) * (laminate.mult || 1) * (rush.mult || 1);\n    var unit = Math.max(rawUnit, cfg.floor || 0);\n    var subtotal = unit * q;\n\n    var promoRate = promoRateForQty(q, cfg.promoTiers);\n    var promoAmount = subtotal * promoRate;\n    var afterPromo = subtotal - promoAmount;\n\n    var codeApplied = false;\n    var codeAmount = 0;\n    if (input.promoCode && cfg.promoCode && cfg.promoCode.code &&\n        String(input.promoCode).trim().toUpperCase() === cfg.promoCode.code.toUpperCase()) {\n      codeApplied = true;\n      codeAmount = afterPromo * (cfg.promoCode.rate || 0);\n    }\n\n    var total = lamTronChanHangNghin(afterPromo - codeAmount);\n\n    var subtotalRounded = lamTronChanHangNghin(subtotal);\n    var displayUnit = Math.floor(subtotalRounded / q);\n    var displaySubtotal = displayUnit * q;\n    var displayPromo = Math.max(0, displaySubtotal - total);\n\n    return {\n      material: material ? material.title : null,\n      shape: shape ? shape.label : null,\n      quantity: q,\n      unit: displayUnit,\n      subtotal: displaySubtotal,\n      promoRate: promoRate,\n      promoAmount: displayPromo,\n      codeApplied: codeApplied,\n      codeAmount: 0,\n      total: total\n    };\n  }\n\n  global.DecalPricingEngine = {\n    vlookup: vlookup,\n    estimate: estimate,\n    heSoHaoHut: heSoHaoHut,\n    xacDi   function updatePreview(){
    clearTimeout(previewTimer);

      document.getElementById('previewFrame').srcdoc = renderPageHTML(content, excelSheets);
    }, 200);
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveLocal, 600);
  }

  function exportHTML(){
    var html = renderPageHTML(content, excelSheets);
    var blob = new Blob([html], {type:'text/html'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'decal-tem-nhan-landing.html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /* ---------------- Form builders ---------------- */
  function el(tag, attrs, children){
    var e = document.createElement(tag);
    for (var k in (attrs||{})) {
      if (k === 'text') e.textContent = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(function(c){ e.appendChild(c); });
    return e;
  }

  function fieldText(label, value, onInput, multiline){
    var wrap = el('div', {class:'f-row'});
    wrap.appendChild(el('label', {text:label}));
    var input = el(multiline ? 'textarea' : 'input', multiline ? {} : {type:'text'});
    input.value = value || '';
    input.addEventListener('input', function(){ onInput(input.value); updatePreview(); });
    wrap.appendChild(input);
    return wrap;
  }

  function fieldImage(label, value, onInput){
    var wrap = el('div', {class:'f-row'});
    wrap.appendChild(el('label', {text:label}));
    var input = el('input', {type:'url', placeholder:'https://...'});
    input.value = value || '';
    var img = el('img', {class:'img-preview', src: value || ''});
    img.onerror = function(){ img.style.opacity = '.3'; };
    input.addEventListener('input', function(){ onInput(input.value); img.src = input.value; img.style.opacity='1'; updatePreview(); });
    wrap.appendChild(input);

    var uploadRow = el('div', {class:'upload-row'});
    var fileInput = el('input', {type:'file', accept:'image/png,image/jpeg,image/webp,image/gif'});
    var uploadStatus = el('span', {class:'upload-status'});
    fileInput.addEventListener('change', function(){
      var file = fileInput.files[0];
      if (!file) return;
      if (file.size > 800 * 1024) {
        uploadStatus.textContent = 'Ảnh hơi nặng (' + Math.round(file.size/1024) + 'KB) — nên dùng ảnh dưới 800KB để file HTML không quá to.';
        uploadStatus.className = 'upload-status err';
      }
      var reader = new FileReader();
      reader.onload = function (e) {
        var dataUrl = e.target.result; // nhúng thẳng base64 — không cần server
        input.value = dataUrl;
        onInput(dataUrl);
        img.src = dataUrl; img.style.opacity = '1';
        updatePreview();
        if (file.size <= 800 * 1024) { uploadStatus.textContent = 'Đã nhúng ảnh vào trang (' + Math.round(file.size/1024) + 'KB).'; uploadStatus.className = 'upload-status ok'; }
        fileInput.value = '';
      };
      reader.readAsDataURL(file);
    });
    uploadRow.appendChild(fileInput);
    uploadRow.appendChild(uploadStatus);
    wrap.appendChild(uploadRow);

    wrap.appendChild(el('div', {class:'hint', text:'Tải ảnh từ máy sẽ nhúng thẳng vào file HTML (không cần host ảnh ở đâu cả) — nên dùng ảnh nhỏ (dưới ~800KB). Hoặc dán URL ảnh có sẵn từ web vào ô phía trên nếu ảnh lớn.'}));
    wrap.appendChild(img);
    return wrap;
  }

    c8.appendChild(renderNumberList('Số mặt', content.pricing.sides, 'label', 'Tên lựa chọn', 'mult', 'Hệ số nhân (1 = không đổi)', 0.05, {label:'Lựa chọn mới', mult:1}));
    c8.appendChild(renderNumberList('Loại màng', content.pricing.laminate, 'label', 'Tên lựa chọn', 'mult', 'Hệ số nhân', 0.05, {label:'Lựa chọn mới', mult:1}));
    c8.appendChild(renderNumberList('Thời gian giao', content.pricing.rush, 'label', 'Tên lựa chọn', 'mult', 'Hệ số nhân', 0.05, {label:'Lựa chọn mới', mult:1}));

    var promoBox = el('div', {class:'f-row'});
    promoBox.appendChild(el('label', {text:'Bậc khuyến mãi theo số lượng'}));
    content.pricing.promoTiers.forEach(function(t, i){
      var card = el('div', {class:'item-card'});
      var top = el('div', {class:'item-top'});
      top.appendChild(el('span', {text:'Bậc #' + (i+1)}));
      var rm = el('button', {class:'item-remove', text:'Xoá'});
      rm.addEventListener('click', function(){ content.pricing.promoTiers.splice(i,1); renderAll(); updatePreview(); });
      top.appendChild(rm);
      card.appendChild(top);
      var row = el('div', {class:'price-row'});
      var qInput = el('input', {type:'text'}); qInput.value = t.minQty; qInput.placeholder = 'Số lượng từ';
      qInput.addEventListener('input', function(){ t.minQty = parseInt(qInput.value,10)||0; updatePreview(); });
      var rInput = el('input', {type:'text'}); rInput.value = Math.round(t.rate*100); rInput.placeholder = '% giảm';
      rInput.addEventListener('input', function(){ t.rate = (parseFloat(rInput.value)||0)/100; updatePreview(); });
      row.appendChild(qInput); row.appendChild(el('span',{text:'cái trở lên, giảm'})); row.appendChild(rInput); row.appendChild(el('span',{text:'%'}));
      card.appendChild(row);
      promoBox.appendChild(card);
    });
    var addTier = el('button', {class:'add-item-btn', text:'+ Thêm bậc khuyến mãi'});
    addTier.addEventListener('click', function(){ content.pricing.promoTiers.push({minQty:100, rate:0}); renderAll(); updatePreview(); });
    promoBox.appendChild(addTier);
    c8.appendChild(promoBox);

    var codeBox = el('div', {class:'f-row'});
    codeBox.appendChild(el('label', {text:'Mã giảm giá (demo, tự xử lý ở phía trình duyệt)'}));
    var codeRow = el('div', {class:'price-row'});
    var codeInput = el('input', {type:'text'}); codeInput.value = content.pricing.promoCode.code;
    codeInput.addEventListener('input', function(){ content.pricing.promoCode.code = codeInput.value; updatePreview(); });
    var codeRateInput = el('input', {type:'text'}); codeRateInput.value = Math.round(content.pricing.promoCode.rate*100);
    codeRateInput.addEventListener('input', function(){ content.pricing.promoCode.rate = (parseFloat(codeRateInput.value)||0)/100; updatePreview(); });
    codeRow.appendChild(codeInput); codeRow.appendChild(el('span',{text:'giảm thêm'})); codeRow.appendChild(codeRateInput); codeRow.appendChild(el('span',{text:'%'}));
    codeBox.appendChild(codeRow);
    codeBox.appendChild(el('div', {class:'hint', text:'Đây là mã demo xử lý bằng JS, chưa nối với hệ thống kiểm mã thật.'}));
    c8.appendChild(codeBox);

    s8.appendChild(c8); panel.appendChild(s8);

    updatePreview();
  }

  /* ---------------- Toolbar actions ---------------- */
  document.getElementById('exportBtn').addEventListener('click', exportHTML);
  document.getElementById('draftBtn').addEventListener('click', saveLocal);
  document.getElementById('resetBtn').addEventListener('click', function(){
    if (!confirm('Khôi phục toàn bộ nội dung về mặc định? Thao tác này sẽ mất các chỉnh sửa hiện tại.')) return;
    content = defaultContent();
    renderAll();
  });

  loadLocal();
})();
</script>

</body>
</html>
